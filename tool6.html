<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claw Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0c14;
    --surface: #111422;
    --surface2: #181c2e;
    --gold: #f0c040;
    --gold-dim: #a07c20;
    --purple: #8b5cf6;
    --purple-dim: #4c2a8c;
    --cyan: #22d3ee;
    --text: #e8e4d8;
    --text-dim: #8a8680;
    --rare: #f0c040;
    --epic: #c084fc;
    --border: #2a2e44;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
    background-image: radial-gradient(ellipse at 50% 0%, #1a1040 0%, transparent 60%);
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 0 24px #f0c04060;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  /* Gacha controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 28px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 28px;
  }

  .controls-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .count-btns {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .count-btn {
    flex: 1;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }

  .count-btn.selected {
    border-color: var(--gold);
    color: var(--gold);
    background: #1a1400;
  }

  .count-btn:hover:not(.selected) {
    border-color: #444;
    color: var(--text);
  }

  .start-btn {
    width: 100%;
    padding: 14px;
    border-radius: 6px;
    border: none;
    background: linear-gradient(135deg, #c8960a, #f0c040, #c8960a);
    color: #1a0e00;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 18px #f0c04040;
  }

  .start-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 24px #f0c04060;
  }

  .start-btn:active { transform: translateY(0); }

  /* Results */
  .results-box {
    width: 100%;
    max-width: 480px;
    min-height: 60px;
  }

  .results-title {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 6px;
    border-radius: 6px;
    border-left: 3px solid transparent;
    background: var(--surface);
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .result-item.rare {
    border-left-color: var(--rare);
    background: #1a1400;
  }

  .result-item.epic {
    border-left-color: var(--epic);
    background: #160820;
  }

  .item-tag {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .item-tag.rare { background: #2a1e00; color: var(--gold); border: 1px solid #604010; }
  .item-tag.epic { background: #1e0830; color: var(--epic); border: 1px solid #6030a0; }

  .result-name {
    font-size: 0.82rem;
    flex: 1;
    line-height: 1.3;
  }

  .result-name .qty {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-left: 4px;
  }

  .result-rate {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-left: 12px;
    white-space: nowrap;
  }

  .result-rate.rare { color: var(--gold-dim); }
  .result-rate.epic { color: #9f5fe0; }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 32px 0;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  /* Pool info toggle */
  .pool-info-toggle {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
  }

  .pool-table {
    display: none;
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
    border-collapse: collapse;
    font-size: 0.75rem;
  }

  .pool-table.visible { display: table; }

  .pool-table th {
    background: var(--surface2);
    color: var(--text-dim);
    padding: 6px 10px;
    text-align: left;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }

  .pool-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #1e2138;
    vertical-align: middle;
  }

  .pool-table tr:last-child td { border-bottom: none; }

  .pool-table .rate-cell {
    text-align: right;
    color: var(--text-dim);
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1>Claw Simulation</h1>

<!-- Controls -->
<div class="controls">
  <div class="controls-label">Jumlah Gacha</div>
  <div class="count-btns">
    <button class="count-btn selected" id="btn1x" onclick="selectCount(1)">1x Gacha</button>
    <button class="count-btn" id="btn10x" onclick="selectCount(10)">10x Gacha</button>
  </div>
  <button class="start-btn" id="startBtn" onclick="doGacha()">✦ Start Gacha ✦</button>
</div>

<!-- Results -->
<div class="results-box" id="resultsBox">
  <div class="empty-state">Tekan Start Gacha untuk memulai</div>
</div>

<button class="pool-info-toggle" onclick="togglePoolInfo()" id="infoToggle">Lihat daftar item pool ▾</button>

<table class="pool-table" id="poolTable">
  <thead>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Rate</th>
    </tr>
  </thead>
  <tbody id="poolTableBody"></tbody>
</table>

<script>
const POOL = [
  { name: "Collapse Essence (Untradable) Common Pouch", qty: 1, rate: 11.98, type: 'rare' },
  { name: "[GM] Item Protection Magic Jelly (5000) Pouch", qty: 5000, rate: 11.98, type: 'rare' },
  { name: "Gold Dragon Plate Powder x5 Pouch", qty: 5, rate: 7.99, type: 'rare' },
  { name: "Faded Memory x10 Pouch", qty: 10, rate: 7.99, type: 'rare' },
  { name: "High Purity Otherworldly Core Pouch", qty: 3, rate: 7.99, type: 'rare' },
  { name: "High Purity Dimensional Core Pouch", qty: 3, rate: 7.99, type: 'rare' },
  { name: "Faded Bestie Star x50 Pouch", qty: 50, rate: 7.99, type: 'rare' },
  { name: "Lunar Eclipse Dragon Jade (Ancient) +5 Enhancement Hammer Pouch", qty: 1, rate: 6.39, type: 'rare' },
  { name: "Flawless Core Pouch", qty: 1, rate: 3.99, type: 'rare' },
  { name: "Twisted Root X10 Pouch", qty: 1, rate: 3.99, type: 'rare' },
  { name: "Deeply Rooted Fragment of Longing x2 Pouch", qty: 5, rate: 3.99, type: 'rare' },
  { name: "Brooch Ring", qty: 1, rate: 3.99, type: 'rare' },
  { name: "Gold Dragon Jewel Fragment x1 Pouch", qty: 1, rate: 3.19, type: 'rare' },
  { name: "Golden Oath Pouch", qty: 1, rate: 3.19, type: 'rare' },
  { name: "Variant Dragon Jade Evolver ver.3 (Untradable) Common Pouch", qty: 1, rate: 2.40, type: 'rare' },
  { name: "Eternal Fragment of Longing x2", qty: 2, rate: 2.40, type: 'rare' },
  { name: "Rainbow Star", qty: 1, rate: 1.60, type: 'rare' },
  { name: "Sunset Energy Rune Enhancement Hammer (+6 - +14) Pouch", qty: 1, rate: 0.80, type: 'rare' },
  { name: "Mutated Evolution Acceleration Pouch", qty: 1, rate: 0.16, type: 'rare' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+12) Pouch", qty: 1, rate: 10.17, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+13) Pouch", qty: 1, rate: 9.32, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+13) Pouch", qty: 1, rate: 9.32, type: 'epic' },
  { name: "Eternal Talisman Essence (Lv.4) Pouch", qty: 1, rate: 8.47, type: 'epic' },
  { name: "Coordination Coin Pouch", qty: 1, rate: 8.47, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+12) Pouch", qty: 1, rate: 8.47, type: 'epic' },
  { name: "[10% Chance] Icy Hammer Pouch", qty: 4, rate: 8.47, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+14) Pouch", qty: 1, rate: 5.93, type: 'epic' },
  { name: "[20% Chance] Icy Hammer Pouch", qty: 4, rate: 5.08, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+15) Pouch", qty: 1, rate: 5.08, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+15) Pouch", qty: 1, rate: 5.08, type: 'epic' },
  { name: "Brooch Ring x50", qty: 2, rate: 4.24, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+14) Pouch", qty: 1, rate: 4.24, type: 'epic' },
  { name: "Iona Accessory +1 Selection Box", qty: 1, rate: 4.24, type: 'epic' },
  { name: "Eternal Talisman (Lv.5)(Event) Selection Pouch", qty: 1, rate: 1.69, type: 'epic' },
  { name: "Blessed Black Dragon's Ancient Element Special Talisman Pouch", qty: 1, rate: 1.69, type: 'epic' },
];

let gachaCount = 1;
let poolInfoVisible = false;

function selectCount(n) {
  gachaCount = n;
  document.getElementById('btn1x').classList.toggle('selected', n === 1);
  document.getElementById('btn10x').classList.toggle('selected', n === 10);
}

function weightedRandom() {
  const total = POOL.reduce((s, i) => s + i.rate, 0);
  let r = Math.random() * total;
  for (const item of POOL) {
    r -= item.rate;
    if (r <= 0) return item;
  }
  return POOL[POOL.length - 1];
}

function doGacha() {
  const results = [];
  for (let i = 0; i < gachaCount; i++) results.push(weightedRandom());

  const box = document.getElementById('resultsBox');
  const titleHTML = `<div class="results-title">Hasil Gacha (${gachaCount}x)</div>`;
  const itemsHTML = results.map(item => `
    <div class="result-item ${item.type}">
      <span class="result-name">
        ${item.name}${item.qty > 1 ? `<span class="qty">×${item.qty}</span>` : ''}
        <span class="item-tag ${item.type}">${item.type === 'rare' ? 'Rare' : 'Epic'}</span>
      </span>
      <span class="result-rate ${item.type}">${item.rate.toFixed(2)}%</span>
    </div>
  `).join('');

  box.innerHTML = titleHTML + itemsHTML;
}

function togglePoolInfo() {
  poolInfoVisible = !poolInfoVisible;
  const table = document.getElementById('poolTable');
  const btn = document.getElementById('infoToggle');
  if (poolInfoVisible) {
    table.classList.add('visible');
    btn.textContent = 'Sembunyikan daftar item ▴';
    renderPoolTable();
  } else {
    table.classList.remove('visible');
    btn.textContent = 'Lihat daftar item pool ▾';
  }
}

function renderPoolTable() {
  const tbody = document.getElementById('poolTableBody');
  tbody.innerHTML = POOL.map(item => `
    <tr>
      <td>${item.name} <span class="item-tag ${item.type}">${item.type === 'rare' ? 'Rare' : 'Epic'}</span></td>
      <td style="text-align:center;color:var(--text-dim)">${item.qty}</td>
      <td class="rate-cell">${item.rate.toFixed(2)}%</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
