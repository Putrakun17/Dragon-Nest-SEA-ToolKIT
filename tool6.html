<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claw Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0c14;
    --surface: #111422;
    --surface2: #181c2e;
    --gold: #f0c040;
    --gold-dim: #a07c20;
    --purple: #8b5cf6;
    --purple-dim: #4c2a8c;
    --cyan: #22d3ee;
    --text: #e8e4d8;
    --text-dim: #8a8680;
    --rare: #f0c040;
    --epic: #c084fc;
    --border: #2a2e44;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
    background-image: radial-gradient(ellipse at 50% 0%, #1a1040 0%, transparent 60%);
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 0 24px #f0c04060;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  /* Gacha controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 28px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 28px;
  }

  .controls-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .count-btns {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .count-btn {
    flex: 1;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }

  .count-btn.selected {
    border-color: var(--gold);
    color: var(--gold);
    background: #1a1400;
  }

  .count-btn:hover:not(.selected) {
    border-color: #444;
    color: var(--text);
  }

  .start-btn {
    width: 100%;
    padding: 14px;
    border-radius: 6px;
    border: none;
    background: linear-gradient(135deg, #c8960a, #f0c040, #c8960a);
    color: #1a0e00;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 18px #f0c04040;
  }

  .start-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 24px #f0c04060;
  }

  .start-btn:active { transform: translateY(0); }

  /* Results */
  .results-box {
    width: 100%;
    max-width: 480px;
    min-height: 60px;
  }

  .results-title {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 6px;
    border-radius: 6px;
    border-left: 3px solid transparent;
    background: var(--surface);
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .result-item.rare {
    border-left-color: var(--rare);
    background: #1a1400;
  }

  .result-item.epic {
    border-left-color: var(--epic);
    background: #160820;
  }

  .item-tag {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .item-tag.rare { background: #2a1e00; color: var(--gold); border: 1px solid #604010; }
  .item-tag.epic { background: #1e0830; color: var(--epic); border: 1px solid #6030a0; }

  .result-name {
    font-size: 0.82rem;
    flex: 1;
    line-height: 1.3;
  }

  .result-name .qty {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-left: 4px;
  }

  .result-rate {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-left: 12px;
    white-space: nowrap;
  }

  .result-rate.rare { color: var(--gold-dim); }
  .result-rate.epic { color: #9f5fe0; }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 32px 0;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  /* Pool info toggle */
  .pool-info-toggle {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
  }

  .pool-table {
    display: none;
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
    border-collapse: collapse;
    font-size: 0.75rem;
  }

  .pool-table.visible { display: table; }

  .obtained-box {
    width: 100%;
    max-width: 480px;
    margin-top: 8px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .pool-table th {
    background: var(--surface2);
    color: var(--text-dim);
    padding: 6px 10px;
    text-align: left;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }

  .pool-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #1e2138;
    vertical-align: middle;
  }

  .pool-table tr:last-child td { border-bottom: none; }

  .pool-table .rate-cell {
    text-align: right;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* Token counter */
  .token-bar {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    border-bottom: 1px solid rgba(42,46,68,0.5);
    padding: 16px 20px;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .token-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .token-display {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .token-count {
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 16px #f0c04060;
    min-width: 48px;
    text-align: right;
    line-height: 1;
  }

  .token-icon {
    font-size: 1.4rem;
  }

  .token-reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.72rem;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.18s;
  }

  .token-reset-btn:hover {
    border-color: #666;
    color: var(--text);
  }

  .token-gained {
    font-size: 0.82rem;
    color: var(--gold-dim);
    font-style: italic;
  }

  .result-token {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--gold);
    margin-top: 4px;
    font-weight: 600;
  }

  /* Gacha info bar */
  .gacha-info-bar {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    margin-top: -12px;
    margin-bottom: 20px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .gacha-info-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .gacha-info-label {
    font-size: 0.64rem;
    color: var(--text-muted, #5a5040);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .gacha-info-value {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-dim);
  }

  .gacha-info-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    flex-shrink: 0;
    margin: 0 4px;
  }
</style>
</head>
<body>

<h1>Claw Simulation</h1>

<!-- Token Bar -->
<div class="token-bar">
  <div>
    <div class="token-label">Total Tokens Collected</div>
    <div class="token-gained" id="tokenGainedLabel">&nbsp;</div>
  </div>
  <div class="token-display">
    <span class="token-icon">🪙</span>
    <span class="token-count" id="tokenCount">0</span>
  </div>
  <button class="token-reset-btn" onclick="resetTokens()">Reset</button>
</div>

<!-- Gacha Count Info -->
<div class="gacha-info-bar">
  <div class="gacha-info-item">
    <span class="gacha-info-label">Total Pulls</span>
    <span class="gacha-info-value" id="totalGachaCount">0x</span>
  </div>
  <div class="gacha-info-divider"></div>
  <div class="gacha-info-item">
    <span class="gacha-info-label">Last Pull</span>
    <span class="gacha-info-value" id="lastGachaCount">—</span>
  </div>
  <div class="gacha-info-divider"></div>
  <div class="gacha-info-item">
    <span class="gacha-info-label">Avg Token/Pull</span>
    <span class="gacha-info-value" id="avgTokenPerGacha">—</span>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <div class="controls-label">Number of Pulls</div>
  <div class="count-btns">
    <button class="count-btn selected" id="btn1x" onclick="selectCount(1)">1x Pull</button>
    <button class="count-btn" id="btn10x" onclick="selectCount(10)">10x Pull</button>
  </div>
  <button class="start-btn" id="startBtn" onclick="doGacha()">✦ Start Pull ✦</button>
</div>

<!-- Results -->
<div class="results-box" id="resultsBox">
  <div class="empty-state">Press Start Pull to begin</div>
</div>

<button class="pool-info-toggle" onclick="toggleObtained()" id="infoToggle">Items Obtained ▾</button>

<div class="obtained-box" id="obtainedBox" style="display:none;">
  <table id="obtainedTable" style="width:100%;border-collapse:collapse;font-size:0.75rem;">
    <thead>
      <tr>
        <th style="background:var(--surface2);color:var(--text-dim);padding:6px 10px;text-align:left;font-weight:500;border-bottom:1px solid var(--border);">Item</th>
        <th style="background:var(--surface2);color:var(--text-dim);padding:6px 10px;text-align:center;font-weight:500;border-bottom:1px solid var(--border);">Count</th>
      </tr>
    </thead>
    <tbody id="obtainedTableBody">
      <tr><td colspan="2" style="text-align:center;color:var(--text-dim);padding:16px">No items obtained yet</td></tr>
    </tbody>
  </table>
</div>

<script>
// Token drop rates
const TOKEN_RATES = [
  { tokens: 1, rate: 10 },
  { tokens: 2, rate: 15 },
  { tokens: 3, rate: 25 },
  { tokens: 4, rate: 25 },
  { tokens: 5, rate: 25 },
];
// Total = 100%, so no-token = 0% (every pull gives tokens)

let totalTokens = 0;
let totalGachaCount = 0;
let obtainedMap = {}; // key: item name, value: { item, count }

function updateGachaInfo(lastCount) {
  document.getElementById('totalGachaCount').textContent = totalGachaCount + 'x';
  document.getElementById('lastGachaCount').textContent = lastCount + 'x';
  const avg = totalGachaCount > 0 ? (totalTokens / totalGachaCount).toFixed(2) : '—';
  document.getElementById('avgTokenPerGacha').textContent = avg !== '—' ? avg : '—';
}

function rollToken() {
  const r = Math.random() * 100;
  let acc = 0;
  for (const t of TOKEN_RATES) {
    acc += t.rate;
    if (r < acc) return t.tokens;
  }
  return TOKEN_RATES[TOKEN_RATES.length - 1].tokens;
}

function updateTokenDisplay(gained) {
  document.getElementById('tokenCount').textContent = totalTokens;
  if (gained > 0) {
    document.getElementById('tokenGainedLabel').textContent = `+${gained} from this pull`;
  }
}

function resetTokens() {
  totalTokens = 0;
  totalGachaCount = 0;
  obtainedMap = {};
  document.getElementById('tokenCount').textContent = '0';
  document.getElementById('tokenGainedLabel').innerHTML = '&nbsp;';
  document.getElementById('totalGachaCount').textContent = '0x';
  document.getElementById('lastGachaCount').textContent = '—';
  document.getElementById('avgTokenPerGacha').textContent = '—';
  renderObtainedTable();
}

const POOL = [
  { name: "Collapse Essence (Untradable) Common Pouch", qty: 1, rate: 11.98, type: 'rare' },
  { name: "[GM] Item Protection Magic Jelly (5000) Pouch", qty: 5000, rate: 11.98, type: 'rare' },
  { name: "Gold Dragon Plate Powder x5 Pouch", qty: 5, rate: 7.99, type: 'rare' },
  { name: "Faded Memory x10 Pouch", qty: 10, rate: 7.99, type: 'rare' },
  { name: "High Purity Otherworldly Core Pouch", qty: 3, rate: 7.99, type: 'rare' },
  { name: "High Purity Dimensional Core Pouch", qty: 3, rate: 7.99, type: 'rare' },
  { name: "Faded Bestie Star x50 Pouch", qty: 50, rate: 7.99, type: 'rare' },
  { name: "Lunar Eclipse Dragon Jade (Ancient) +5 Enhancement Hammer Pouch", qty: 1, rate: 6.39, type: 'rare' },
  { name: "Flawless Core Pouch", qty: 1, rate: 3.99, type: 'rare' },
  { name: "Twisted Root X10 Pouch", qty: 1, rate: 3.99, type: 'rare' },
  { name: "Deeply Rooted Fragment of Longing x2 Pouch", qty: 5, rate: 3.99, type: 'rare' },
  { name: "Brooch Ring", qty: 1, rate: 3.99, type: 'rare' },
  { name: "Gold Dragon Jewel Fragment x1 Pouch", qty: 1, rate: 3.19, type: 'rare' },
  { name: "Golden Oath Pouch", qty: 1, rate: 3.19, type: 'rare' },
  { name: "Variant Dragon Jade Evolver ver.3 (Untradable) Common Pouch", qty: 1, rate: 2.40, type: 'rare' },
  { name: "Eternal Fragment of Longing x2", qty: 2, rate: 2.40, type: 'rare' },
  { name: "Rainbow Star", qty: 1, rate: 1.60, type: 'rare' },
  { name: "Sunset Energy Rune Enhancement Hammer (+6 - +14) Pouch", qty: 1, rate: 0.80, type: 'rare' },
  { name: "Mutated Evolution Acceleration Pouch", qty: 1, rate: 0.16, type: 'rare' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+12) Pouch", qty: 1, rate: 10.17, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+13) Pouch", qty: 1, rate: 9.32, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+13) Pouch", qty: 1, rate: 9.32, type: 'epic' },
  { name: "Eternal Talisman Essence (Lv.4) Pouch", qty: 1, rate: 8.47, type: 'epic' },
  { name: "Coordination Coin Pouch", qty: 1, rate: 8.47, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+12) Pouch", qty: 1, rate: 8.47, type: 'epic' },
  { name: "[10% Chance] Icy Hammer Pouch", qty: 4, rate: 8.47, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+14) Pouch", qty: 1, rate: 5.93, type: 'epic' },
  { name: "[20% Chance] Icy Hammer Pouch", qty: 4, rate: 5.08, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+15) Pouch", qty: 1, rate: 5.08, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Armor Enhancement (+15) Pouch", qty: 1, rate: 5.08, type: 'epic' },
  { name: "Brooch Ring x50", qty: 2, rate: 4.24, type: 'epic' },
  { name: "Ancient Dragon Power-Infused Weapon Enhancement (+14) Pouch", qty: 1, rate: 4.24, type: 'epic' },
  { name: "Iona Accessory +1 Selection Box", qty: 1, rate: 4.24, type: 'epic' },
  { name: "Eternal Talisman (Lv.5)(Event) Selection Pouch", qty: 1, rate: 1.69, type: 'epic' },
  { name: "Blessed Black Dragon's Ancient Element Special Talisman Pouch", qty: 1, rate: 1.69, type: 'epic' },
];

let gachaCount = 1;
function selectCount(n) {
  gachaCount = n;
  document.getElementById('btn1x').classList.toggle('selected', n === 1);
  document.getElementById('btn10x').classList.toggle('selected', n === 10);
}

function weightedRandom() {
  const total = POOL.reduce((s, i) => s + i.rate, 0);
  let r = Math.random() * total;
  for (const item of POOL) {
    r -= item.rate;
    if (r <= 0) return item;
  }
  return POOL[POOL.length - 1];
}

function doGacha() {
  const results = [];
  let gainedTokens = 0;

  for (let i = 0; i < gachaCount; i++) {
    const item = weightedRandom();
    const tok = rollToken();
    gainedTokens += tok;
    results.push({ item, tok });
  }

  totalTokens += gainedTokens;
  totalGachaCount += gachaCount;
  updateTokenDisplay(gainedTokens);
  updateGachaInfo(gachaCount);

  // Track obtained items
  for (const { item } of results) {
    if (obtainedMap[item.name]) {
      obtainedMap[item.name].count++;
    } else {
      obtainedMap[item.name] = { item, count: 1 };
    }
  }
  renderObtainedTable();

  const box = document.getElementById('resultsBox');
  const titleHTML = `<div class="results-title">Pull Results (${gachaCount}x) · <span style="color:var(--gold)">+${gainedTokens} Token</span></div>`;

  const itemsHTML = results.map(({ item, tok }) => `
    <div class="result-item ${item.type}">
      <span class="result-name">
        ${item.name}${item.qty > 1 ? `<span class="qty">×${item.qty}</span>` : ''}
        <span class="item-tag ${item.type}">${item.type === 'rare' ? 'Rare' : 'Epic'}</span>
        <span class="result-token">🪙 +${tok} token</span>
      </span>
      <span class="result-rate ${item.type}">${item.rate.toFixed(2)}%</span>
    </div>
  `).join('');

  box.innerHTML = titleHTML + itemsHTML;
}

let obtainedVisible = false;

function toggleObtained() {
  obtainedVisible = !obtainedVisible;
  const box = document.getElementById('obtainedBox');
  const btn = document.getElementById('infoToggle');
  box.style.display = obtainedVisible ? 'block' : 'none';
  btn.textContent = obtainedVisible ? 'Items Obtained ▴' : 'Items Obtained ▾';
}

function renderObtainedTable() {
  const tbody = document.getElementById('obtainedTableBody');
  const entries = Object.values(obtainedMap);
  if (entries.length === 0) {
    tbody.innerHTML = `<tr><td colspan="2" style="text-align:center;color:var(--text-dim);padding:16px">No items obtained yet</td></tr>`;
    return;
  }
  // Sort by count desc
  entries.sort((a, b) => b.count - a.count);
  tbody.innerHTML = entries.map(({ item, count }) => `
    <tr>
      <td>
        ${item.name}
        <span class="item-tag ${item.type}">${item.type === 'rare' ? 'Rare' : 'Epic'}</span>
      </td>
      <td style="text-align:center;font-family:'Cinzel',serif;font-weight:700;color:${count > 1 ? 'var(--gold)' : 'var(--text-dim)'}">
        ${count > 1 ? '×' + count : count}
      </td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
