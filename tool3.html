<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Dragon Jewel Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a84c;--gl:#f0d080;--gd:#7a5c1e;
  --anc:#e8b4ff;--ang:#cc66ff;
  --bg:#111018;--bgm:#1a1628;--bgp:#1e1830;--bgc:#15111f;
  --bdr:rgba(201,168,76,.2);--bdh:rgba(201,168,76,.4);
  --tx:#ddd5be;--txd:#6a5e42;
  --ok:#5fffb0;--err:#ff6060;
  --gs:#4a3a1a;--gf:#1e1610;
}
body{background:var(--bg) radial-gradient(ellipse 60% 40% at 50% 0%,rgba(40,20,60,.6),transparent 70%);color:var(--tx);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden}
.page{max-width:1100px;margin:0 auto;padding:2rem 1.25rem 4rem}

/* header */
.hdr{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--bdr);position:relative}
.hdr::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:140px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hdr-eye{font-size:.7rem;letter-spacing:.35em;color:var(--gd);text-transform:uppercase;margin-bottom:.6rem}
.hdr h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1.3rem,3.5vw,2rem);color:var(--gl);text-shadow:0 0 40px rgba(201,168,76,.45)}

/* layout */
.layout{display:grid;grid-template-columns:300px 1fr;gap:1.25rem;align-items:start}
@media(max-width:720px){.layout{grid-template-columns:1fr}}

/* left panel */
.lpanel{background:var(--bgp);border:1px solid var(--bdr);border-radius:10px;padding:1.25rem;position:relative;overflow:hidden}
.lpanel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gd),transparent)}
.item-name{font-family:'Cinzel Decorative',serif;font-size:.75rem;color:#ff9966;text-align:center;margin-bottom:1rem}

/* counter */
.counter{display:flex;align-items:center;justify-content:center;gap:.75rem;margin-bottom:1rem;background:rgba(0,0,0,.35);border:1px solid var(--bdr);border-radius:8px;padding:.6rem 1rem}
.c-icon{font-size:1.4rem}
.c-wrap{text-align:center}
.c-lbl{font-size:.65rem;letter-spacing:.15em;color:var(--txd);text-transform:uppercase}
.c-val{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:var(--gl);line-height:1;transition:color .3s}
.c-val.low{color:var(--err)}.c-val.zero{color:var(--txd)}
.c-sep{color:var(--txd);font-size:.9rem;align-self:flex-end;padding-bottom:.2rem}
.c-tot{font-family:'Cinzel Decorative',serif;font-size:1rem;color:var(--txd);align-self:flex-end;padding-bottom:.15rem}

/* gear */
.gear-wrap{width:220px;height:220px;margin:0 auto 1rem;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.gear-wrap.empty{cursor:not-allowed;opacity:.5}
.go{animation:gR 12s linear infinite;transform-origin:50% 50%}
.gm{animation:gR 8s linear infinite reverse;transform-origin:50% 50%}
.gi{animation:gR 5s linear infinite;transform-origin:50% 50%}
.gear-wrap.spin .go{animation:gF .6s ease-out,gR 12s linear .6s infinite}
.gear-wrap.spin .gm{animation:gFR .6s ease-out,gR 8s linear reverse .6s infinite}
.gear-wrap.spin .gi{animation:gF .6s ease-out,gR 5s linear .6s infinite}
@keyframes gR{to{transform:rotate(360deg)}}
@keyframes gF{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
@keyframes gFR{0%{transform:rotate(0)}100%{transform:rotate(-720deg)}}
.gem{position:absolute;width:56px;height:56px;border-radius:6px;background:radial-gradient(circle at 35% 30%,#ff8844,#cc3300 60%,#6a1100);border:2px solid rgba(255,150,80,.6);box-shadow:0 0 20px rgba(255,100,30,.5),inset 0 0 10px rgba(255,200,100,.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;z-index:10;transition:box-shadow .3s}
.gear-wrap.spin .gem{box-shadow:0 0 40px rgba(255,100,30,.9),inset 0 0 20px rgba(255,200,100,.5)}
.hint{text-align:center;font-size:.75rem;color:var(--txd);margin-bottom:.85rem;font-style:italic}

/* tabs */
.tabs{display:flex;gap:.5rem;margin-bottom:.85rem}
.tab{flex:1;padding:.4rem;border:1px solid var(--bdr);border-radius:5px;background:transparent;color:var(--txd);font-family:'Crimson Pro',serif;font-size:.88rem;cursor:pointer;text-align:center;transition:all .2s}
.tab.active{background:rgba(201,168,76,.1);border-color:var(--gold);color:var(--gl)}
.tab:hover:not(.active){border-color:var(--gd);color:var(--tx)}

/* input */
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.field label{font-size:.7rem;letter-spacing:.1em;color:var(--txd);text-transform:uppercase}
.field input{background:rgba(0,0,0,.45);border:1px solid var(--bdr);border-radius:5px;color:var(--gl);font-family:'Crimson Pro',serif;font-size:1rem;padding:.4rem .6rem;outline:none;width:100%;transition:border-color .2s}
.field input:focus{border-color:var(--gold)}

/* buttons */
.btn-row{display:flex;gap:.5rem}
.btn-start{flex:1;padding:.75rem;background:linear-gradient(135deg,#2a1a50,#3d2570);border:1px solid rgba(180,140,255,.4);border-radius:7px;color:var(--anc);font-family:'Cinzel Decorative',serif;font-size:.8rem;letter-spacing:.08em;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn-start::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.07))}
.btn-start:hover{background:linear-gradient(135deg,#3a2460,#4e328a);box-shadow:0 0 20px rgba(160,100,255,.3);transform:translateY(-1px)}
.btn-reset{padding:.75rem .9rem;background:rgba(0,0,0,.3);border:1px solid var(--bdr);border-radius:7px;color:var(--txd);font-family:'Crimson Pro',serif;font-size:.88rem;cursor:pointer;transition:all .2s}
.btn-reset:hover{border-color:var(--gd);color:var(--tx)}

/* right panel */
.rpanel{display:flex;flex-direction:column;gap:1.25rem}

/* split pre/post */
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.split-hdr{background:var(--bgm);border-bottom:1px solid var(--bdr);padding:.55rem 1rem;font-family:'Cinzel Decorative',serif;font-size:.62rem;letter-spacing:.15em;color:var(--gd);text-transform:uppercase}
.split-hdr.r{border-left:1px solid var(--bdr)}
.slots-pre,.slots-post{background:var(--bgc);padding:.9rem;min-height:180px}
.slots-post{border-left:1px solid var(--bdr)}

/* slot */
.sw{position:relative;margin-bottom:.45rem}
.slot{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:.55rem .8rem;font-size:.88rem;color:var(--txd);min-height:36px;display:flex;align-items:center;transition:border-color .2s}
.slot.on{border-color:rgba(201,168,76,.2)}
.slot.rev{animation:sRev .35s ease-out both}
@keyframes sRev{0%{opacity:0;transform:translateY(-5px) scale(.97)}100%{opacity:1;transform:none}}
.slot.locked{border-color:rgba(240,160,48,.5)!important;background:rgba(80,50,10,.25)!important;color:#f0c060!important}
.t1{color:#9a8060}.t2{color:var(--tx)}.t3{color:#a0d0ff}.t4{color:var(--gl)}.t5{color:var(--anc);text-shadow:0 0 10px rgba(204,102,255,.5)}

/* lock btn */
.lbtn{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:1px solid rgba(255,255,255,.12);border-radius:4px;color:var(--txd);font-size:.75rem;cursor:pointer;padding:.15rem .4rem;transition:all .2s;line-height:1;z-index:2}
.lbtn:hover{border-color:var(--gd);color:var(--gl)}
.lbtn.on{border-color:#f0a030;color:#f0a030;background:rgba(240,160,48,.1)}

/* verdict */
.verdict{text-align:center;padding:.7rem 1rem;border-radius:8px;border:1px solid var(--bdr);display:none;color:var(--txd);background:rgba(0,0,0,.2);font-family:'Cinzel Decorative',serif;font-size:.78rem}
.verdict.show{display:block}

/* panels */
.panel{background:var(--bgp);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;display:none}
.panel.show{display:block}
.panel-hdr{background:var(--bgm);border-bottom:1px solid var(--bdr);padding:.55rem 1rem;font-family:'Cinzel Decorative',serif;font-size:.62rem;letter-spacing:.15em;color:var(--gd);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:.75rem}

/* history */
.hist-stats{display:flex;gap:1.5rem;font-size:.8rem;color:var(--txd)}
.hwrap{max-height:240px;overflow-y:auto;padding:.5rem .75rem;font-size:.82rem;scrollbar-width:thin;scrollbar-color:var(--gd) transparent}
.hwrap::-webkit-scrollbar{width:3px}
.hwrap::-webkit-scrollbar-thumb{background:var(--gd);border-radius:2px}
.hrow{display:grid;grid-template-columns:44px 1fr;gap:.5rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.hrow:last-child{border-bottom:none}
.h-n{color:var(--txd);font-size:.73rem}
.h-s{color:var(--txd);font-size:.78rem}
.h-t5{color:var(--anc)}

/* dist */
.dist-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dist-lbl{min-width:56px;font-size:.7rem;color:var(--txd);text-align:right}
.dist-bg{flex:1;background:rgba(0,0,0,.4);border-radius:3px;height:13px;overflow:hidden}
.dist-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#3a1460,var(--ang));transition:width .4s}
.dist-pct{min-width:36px;font-size:.7rem;color:var(--txd)}

/* pakiha */
.pk-total{font-size:.85rem;color:var(--gl)}
.pk-body{padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem}
.pk-entry{background:rgba(240,160,48,.08);border:1px solid rgba(240,160,48,.25);border-radius:6px;padding:.35rem .7rem;font-size:.82rem;color:#f0c060;display:flex;align-items:center;gap:.4rem}
.pk-slot{color:var(--txd);font-size:.73rem}
.pk-cost{color:#f0a030;font-weight:600}
.pk-sum{padding:.4rem 1rem .75rem;font-size:.8rem;color:var(--txd);font-style:italic}

/* sparkle */
.spark{position:fixed;pointer-events:none;z-index:999;width:5px;height:5px;border-radius:50%;animation:spk .8s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
</style>
</head>
<body>
<div class="page">

<div class="hdr">
  <p class="hdr-eye">Gold Dragon Equipment</p>
  <h1>Gold Dragon Jewel Simulator</h1>
</div>

<div class="layout">

  <!-- LEFT -->
  <div class="lpanel">
    <p class="item-name" id="itemName">Gold Dragon Weapon</p>

    <div class="counter">
      <span class="c-icon">💎</span>
      <div class="c-wrap">
        <div class="c-lbl">Jewel</div>
        <div class="c-val" id="tsCount">—</div>
      </div>
      <span class="c-sep">/</span>
      <div class="c-tot" id="tsTotal">—</div>
    </div>

    <div class="gear-wrap" id="gearWrap" onclick="doRoll()">
      <svg width="220" height="220" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0">
        <g class="go" transform="translate(120,120)">
          <polygon points="0,-108 12,-98 22,-105 28,-92 42,-96 44,-82 58,-82 56,-68 70,-64 64,-52 76,-44 67,-34 77,-23 65,-16 71,-3 58,1 60,15 47,16 45,30 32,27 26,41 14,35 4,47 -4,39 -14,47 -26,35 -32,41 -45,30 -47,16 -60,15 -58,1 -71,-3 -65,-16 -77,-23 -67,-34 -76,-44 -64,-52 -70,-64 -56,-68 -58,-82 -44,-82 -42,-96 -28,-92 -22,-105 -12,-98" fill="var(--gf)" stroke="var(--gs)" stroke-width="1.5"/>
          <circle r="65" fill="rgba(0,0,0,.5)" stroke="var(--gs)" stroke-width="1.5"/>
          <line x1="0" y1="-65" x2="0" y2="65" stroke="var(--gs)" stroke-width="1" opacity=".35"/>
          <line x1="-65" y1="0" x2="65" y2="0" stroke="var(--gs)" stroke-width="1" opacity=".35"/>
          <line x1="-46" y1="-46" x2="46" y2="46" stroke="var(--gs)" stroke-width="1" opacity=".35"/>
          <line x1="46" y1="-46" x2="-46" y2="46" stroke="var(--gs)" stroke-width="1" opacity=".35"/>
        </g>
        <g class="gm" transform="translate(120,120)">
          <polygon points="0,-60 9,-53 16,-58 19,-49 28,-51 29,-42 38,-41 37,-32 46,-28 43,-20 51,-14 46,-7 53,-1 46,5 51,12 43,17 46,25 37,27 38,36 29,35 28,44 19,42 16,51 9,46 0,52 -9,46 -16,51 -19,42 -28,44 -29,35 -38,36 -37,27 -46,25 -43,17 -51,12 -46,5 -53,-1 -46,-7 -51,-14 -43,-20 -46,-28 -37,-32 -38,-41 -29,-42 -28,-51 -19,-49 -16,-58 -9,-53" fill="var(--gf)" stroke="#5a4520" stroke-width="1.2"/>
          <circle r="42" fill="rgba(0,0,0,.6)" stroke="#5a4520" stroke-width="1.2"/>
        </g>
        <g class="gi" transform="translate(120,120)">
          <polygon points="0,-38 6,-33 10,-37 12,-31 18,-32 18,-26 24,-24 22,-18 28,-14 25,-9 30,-4 26,0 30,4 25,9 28,14 22,18 24,24 18,26 18,32 12,31 10,37 6,33 0,38 -6,33 -10,37 -12,31 -18,32 -18,26 -24,24 -22,18 -28,14 -25,9 -30,4 -26,0 -30,-4 -25,-9 -28,-14 -22,-18 -24,-24 -18,-26 -18,-32 -12,-31 -10,-37 -6,-33" fill="#2a1e0a" stroke="#6a4a1a" stroke-width="1"/>
          <circle r="24" fill="rgba(10,5,20,.8)" stroke="#5a3a10" stroke-width="1"/>
        </g>
        <g transform="translate(120,120)">
          <circle cx="0" cy="-90" r="2" fill="var(--gd)" opacity=".6"/>
          <circle cx="90" cy="0"  r="2" fill="var(--gd)" opacity=".6"/>
          <circle cx="0" cy="90"  r="2" fill="var(--gd)" opacity=".6"/>
          <circle cx="-90" cy="0" r="2" fill="var(--gd)" opacity=".6"/>
        </g>
      </svg>
      <div class="gem" id="gemEl">⚔️</div>
    </div>

    <p class="hint" id="hint">Click the gear to use a jewel</p>

    <div class="tabs">
      <button class="tab active" onclick="setPart('weapon',this)">Weapon</button>
      <button class="tab" onclick="setPart('armor',this)">Armor</button>
    </div>

    <div class="field">
      <label>Jewel Amount</label>
      <input type="number" id="jewel" value="100" min="1" max="100000">
    </div>

    <div class="btn-row">
      <button class="btn-start" id="startBtn" onclick="initSession()">✦ Start ✦</button>
      <button class="btn-reset" onclick="resetSession()" title="Reset">↺</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="rpanel">

    <div class="split">
      <div>
        <div class="split-hdr">Pre-changes</div>
        <div class="slots-pre" id="slotsPre"></div>
      </div>
      <div>
        <div class="split-hdr r">Post-changes</div>
        <div class="slots-post" id="slotsPost"></div>
      </div>
    </div>

    <div class="verdict" id="verdict"></div>

    <div class="panel" id="pakihaPanel">
      <div class="panel-hdr">
        <span>🔒 Pakiha Digunakan</span>
        <span class="pk-total">Total: <strong id="pkTotal">0</strong> Pakiha</span>
      </div>
      <div class="pk-body" id="pkBody"></div>
      <div class="pk-sum" id="pkSum"></div>
    </div>

    <div class="panel" id="histPanel">
      <div class="panel-hdr">
        <span style="font-family:'Cinzel Decorative',serif">📜 Roll History</span>
        <div class="hist-stats">
          <span>Roll: <strong id="hRoll">0</strong></span>
          <span style="color:var(--anc)">T5: <strong id="hT5">0</strong></span>
        </div>
      </div>
      <div class="hwrap" id="hwrap"></div>
    </div>

    <div class="panel" id="distPanel">
      <div class="panel-hdr">📈 Tier Distribution</div>
      <div class="panel-body" id="distBody"></div>
    </div>

  </div>
</div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const STATS = {
  weapon: [
    {label:'Ancient Dragon Jade',    vals:[100,150,200,250,300]},
    {label:'Blood Moon Dragon Jade', vals:[100,150,200,250,300]},
    {label:'Verdure Dragon Jade',    vals:[100,150,200,250,300]},
    {label:'Dreamy Dragon Jade',     vals:[100,150,200,250,300]},
    {label:'CRT Damage',             vals:[225000,270000,315000,360000,450000], flat:true},
    {label:'CRT',                    vals:[50000,60000,70000,80000,100000],     flat:true},
    {label:'All Attribute ATK',      vals:[3,4,5,6,8]},
    {label:'Physical/Magic ATK',     vals:[3,4,5,6,8]},
  ],
  armor: [
    {label:'Physical/Magic DEF',     vals:[6000,9000,12000,15000,21000],                 flat:true},
    {label:'Max HP',                 vals:[3000000,4500000,6000000,7500000,9000000],     flat:true},
    {label:'Final Damage',           vals:[400,480,560,640,800],                         flat:true},
    {label:'Class Mastery 3 Skill',  vals:[40,80,120,160,200]},
    {label:'Ultimate Skill',         vals:[40,80,120,160,200]},
    {label:'2nd Specialization',     vals:[40,80,120,160,200]},
    {label:'Main Skill',             vals:[40,80,120,160,200]},
    {label:'Secondary Skill',        vals:[40,80,120,160,200]},
  ]
};

// Tier weights: [50,27,10,8,5] — slot index 3 uses half values
const TW = [50,27,10,8,5];

function buildTable(stats, half) {
  const out = []; let cum = 0;
  for (const stat of stats)
    for (let t = 0; t < 5; t++) {
      cum += TW[t] / stats.length;
      out.push({stat, val: half ? stat.vals[t]/2 : stat.vals[t], tier: t+1, cum});
    }
  return out;
}

// Pre-built cumulative tables: TABLES[part][slotIndex]
const TABLES = {
  weapon: [0,1,2,3].map(i => buildTable(STATS.weapon, i===3)),
  armor:  [0,1,2,3].map(i => buildTable(STATS.armor,  i===3)),
};

function pick(table) {
  const r = Math.random() * table.at(-1).cum;
  return table.find(e => r < e.cum) ?? table.at(-1);
}

const fmt = (stat, val) => stat.flat ? val.toLocaleString('en-US') : val + '%';

// ── STATE ─────────────────────────────────────────────────────────────────────
const EMPTY_SLOTS = '<div class="slot">—</div>'.repeat(4);
const PK_COST = 50, MAX_LOCK = 2;

let part     = 'weapon';
let session  = null; // {remaining, total, history, t5Count, prevSlots}
let locks    = {};   // {slotIdx: entry}
let pkLog    = [];   // [{slotIdx, label, cost}]
let rolling  = false;

// DOM helpers
const $ = id => document.getElementById(id);
const el = {
  itemName: $('itemName'), gemEl: $('gemEl'), gearWrap: $('gearWrap'),
  hint: $('hint'), tsCount: $('tsCount'), tsTotal: $('tsTotal'),
  startBtn: $('startBtn'), slotsPre: $('slotsPre'), slotsPost: $('slotsPost'),
  verdict: $('verdict'),
  pakihaPanel: $('pakihaPanel'), pkTotal: $('pkTotal'), pkBody: $('pkBody'), pkSum: $('pkSum'),
  histPanel: $('histPanel'), hRoll: $('hRoll'), hT5: $('hT5'), hwrap: $('hwrap'),
  distPanel: $('distPanel'), distBody: $('distBody'),
};

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function setPart(p, btn) {
  part = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
  el.itemName.textContent = p === 'weapon' ? 'Gold Dragon Weapon' : 'Gold Dragon Armor';
  el.gemEl.textContent    = p === 'weapon' ? '⚔️' : '🛡️';
}

function updateCounter() {
  if (!session) return;
  const r = session.remaining;
  el.tsCount.textContent = r.toLocaleString();
  el.tsCount.className   = 'c-val' + (!r ? ' zero' : r <= Math.ceil(session.total * .1) ? ' low' : '');
  el.tsTotal.textContent = session.total.toLocaleString();
}

function setHint(txt) { el.hint.textContent = txt; }

function clearUI() {
  el.slotsPre.innerHTML = el.slotsPost.innerHTML = EMPTY_SLOTS;
  el.verdict.className  = 'verdict';
  el.verdict.textContent = '';
  el.hwrap.innerHTML = '';
  el.hRoll.textContent = el.hT5.textContent = '0';
  for (const p of [el.pakihaPanel, el.histPanel, el.distPanel]) p.className = 'panel';
}

function showPanel(p) { p.className = 'panel show'; }

// ── SLOTS RENDER ──────────────────────────────────────────────────────────────
function renderSlots(container, slots, animate) {
  const isPost   = container === el.slotsPost;
  const lckCount = Object.keys(locks).length;
  container.innerHTML = slots.map((e, i) => {
    const locked = !!locks[i];
    const cls    = 'slot on' + (locked ? ' locked' : ` t${e.tier}`) + (animate && !locked ? ' rev' : '');
    const style  = animate && !locked ? `animation-delay:${i * .1}s` : '';
    const txt    = `${e.stat.label} +${fmt(e.stat, e.val)}`;
    if (!isPost || !session) return `<div class="sw"><div class="${cls}" style="${style}">${txt}</div></div>`;
    const canLock = !locked && lckCount < MAX_LOCK;
    return `<div class="sw">
      <div class="${cls}" style="${style}">${txt}</div>
      <button class="lbtn${locked ? ' on' : ''}"
        title="${locked ? 'Unlock' : canLock ? 'Lock (50 Pakiha)' : 'Maks 2 slot'}"
        onclick="toggleLock(${i})"
        ${!locked && !canLock ? 'disabled' : ''}>${locked ? '🔒' : '🔓'}</button>
    </div>`;
  }).join('');
}

// ── LOCK ──────────────────────────────────────────────────────────────────────
function toggleLock(i) {
  if (!session?.prevSlots) return;
  if (locks[i]) delete locks[i];
  else {
    if (Object.keys(locks).length >= MAX_LOCK) return;
    locks[i] = session.prevSlots[i];
  }
  updatePakiha();
  renderSlots(el.slotsPost, session.prevSlots, false);
}

function updatePakiha() {
  const lckCount = Object.keys(locks).length;
  const total    = pkLog.reduce((s, e) => s + e.cost, 0);
  if (!lckCount && !pkLog.length) { el.pakihaPanel.className = 'panel'; return; }
  showPanel(el.pakihaPanel);
  el.pkTotal.textContent = total.toLocaleString();

  const slotHTML = (entries, style='') => entries.map(([i, e]) => {
    const filtered = pkLog.filter(l => l.slotIdx == i);
    const cost = filtered.reduce((s, l) => s + l.cost, 0);
    const lbl  = e.stat ? `${e.stat.label} +${fmt(e.stat, e.val)}` : filtered.at(-1)?.label ?? '';
    return `<div class="pk-entry" style="${style}">
      <span class="pk-slot">Slot ${+i+1}</span>
      <span>${lbl}</span>
      <span class="pk-cost">-${cost} Pakiha (${filtered.length}x)</span>
    </div>`;
  }).join('');

  const pastKeys = [...new Set(pkLog.map(l => l.slotIdx))].filter(i => !locks[i]);
  el.pkBody.innerHTML =
    slotHTML(Object.entries(locks)) +
    slotHTML(pastKeys.map(i => [i, {}]), 'opacity:.5');
  el.pkSum.textContent = `${pkLog.length} roll dengan lock · ${total} Pakiha spent · ${lckCount} slot(s) locked`;
}

// ── GACHA ─────────────────────────────────────────────────────────────────────
function rollOne() {
  return [0,1,2,3].map(s => locks[s] ? {...locks[s], locked:true} : pick(TABLES[part][s]));
}

function spawnSparkles() {
  const r = el.gemEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 16; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    const a = Math.PI * 2 * i / 16, d = 60 + Math.random() * 70;
    Object.assign(sp.style, {left: cx+'px', top: cy+'px', background: i%2 ? '#f0d080' : '#cc66ff'});
    sp.style.setProperty('--dx', Math.cos(a)*d + 'px');
    sp.style.setProperty('--dy', Math.sin(a)*d + 'px');
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 900);
  }
}

// ── SESSION ───────────────────────────────────────────────────────────────────
function initSession() {
  const total = Math.min(parseInt($('jewel').value) || 100, 100000);
  session  = {remaining: total, total, history: [], t5Count: 0, prevSlots: null};
  locks    = {};
  pkLog    = [];
  updateCounter();
  clearUI();
  el.startBtn.textContent = '✦ Restart ✦';
  el.gearWrap.classList.remove('empty');
  setHint('Click the gear to use a jewel');
}

function resetSession() {
  session = null; locks = {}; pkLog = [];
  el.tsCount.textContent = el.tsTotal.textContent = '—';
  el.tsCount.className   = 'c-val';
  el.startBtn.textContent = '✦ Start ✦';
  el.gearWrap.classList.remove('empty');
  setHint('Click the gear to use a jewel');
  clearUI();
}

// ── MAIN ROLL ─────────────────────────────────────────────────────────────────
function doRoll() {
  if (rolling) return;
  if (!session) { initSession(); return; }
  if (!session.remaining) return;

  rolling = true;
  const use   = Math.min(4, session.remaining);
  const start = session.total - session.remaining + 1;
  session.remaining -= use;
  updateCounter();

  el.gearWrap.classList.add('spin');
  setTimeout(() => el.gearWrap.classList.remove('spin'), 650);

  setTimeout(() => {
    let best = null, bestT5 = -1;

    for (let i = 0; i < use; i++) {
      const slots = rollOne();
      const t5    = slots.filter(s => s.tier === 5).length;
      if (t5 > bestT5) { bestT5 = t5; best = slots; }
      if (t5 > 0) { session.t5Count += t5; spawnSparkles(); }
      session.history.push({rollNum: start+i, slots, t5});
    }

    if (session.prevSlots) renderSlots(el.slotsPre, session.prevSlots, false);
    renderSlots(el.slotsPost, best, true);
    session.prevSlots = best;

    // Pakiha log per locked slot
    if (Object.keys(locks).length) {
      Object.entries(locks).forEach(([i, e]) =>
        pkLog.push({slotIdx: +i, label: `${e.stat.label} +${fmt(e.stat, e.val)}`, cost: PK_COST}));
      updatePakiha();
    }

    // Verdict
    const range = use > 1 ? `Roll #${start}–${start+use-1}` : `Roll #${start}`;
    el.verdict.className   = 'verdict show';
    el.verdict.textContent = bestT5 > 0
      ? `✦ ${range} — ${bestT5} Tier-5 slot! ✦`
      : `${range} — no Tier-5 this time`;

    updateHistory();

    if (!session.remaining) {
      el.gearWrap.classList.add('empty');
      setHint('Jewel depleted — click Restart');
      renderDist();
    }
    rolling = false;
  }, 350);
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function updateHistory() {
  showPanel(el.histPanel);
  el.hRoll.textContent = session.history.length.toLocaleString();
  el.hT5.textContent   = session.t5Count.toLocaleString();
  el.hwrap.innerHTML   = session.history.slice().reverse().slice(0, 200).map(e =>
    `<div class="hrow">
      <span class="h-n">#${e.rollNum}</span>
      <span class="h-s">${e.slots.map(s =>
        `<span class="${s.tier===5 ? 'h-t5' : ''}">${s.stat.label.split(' ')[0]} T${s.tier}</span>`
      ).join(' · ')}</span>
    </div>`
  ).join('');
}

// ── DISTRIBUTION ──────────────────────────────────────────────────────────────
function renderDist() {
  showPanel(el.distPanel);
  const cnt = [0,0,0,0,0], exp = [50,27,10,8,5];
  let tot = 0;
  session.history.forEach(e => e.slots.forEach(s => { cnt[s.tier-1]++; tot++; }));
  const mx = Math.max(...cnt);
  el.distBody.innerHTML = cnt.map((c, i) => {
    const pct = tot ? (c/tot*100).toFixed(1) : '0.0';
    const bar = mx  ? (c/mx*100).toFixed(1)  : 0;
    const t5  = i === 4;
    return `<div class="dist-row">
      <span class="dist-lbl" ${t5 ? 'style="color:var(--anc)"' : ''}>Tier ${i+1}</span>
      <div class="dist-bg"><div class="dist-fill" style="width:${bar}%;${t5 ? 'background:linear-gradient(90deg,#5a1480,var(--ang))' : ''}"></div></div>
      <span class="dist-pct" ${t5 ? 'style="color:var(--anc)"' : ''}>${pct}% <span style="color:var(--txd);font-size:.65rem">(exp ${exp[i]}%)</span></span>
    </div>`;
  }).join('');
}

// Init
el.slotsPre.innerHTML = el.slotsPost.innerHTML = EMPTY_SLOTS;
</script>
</body>
</html>
